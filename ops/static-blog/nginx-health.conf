# Include this server block in the blog Nginx configuration.
# It is reachable only from the Blog host and is used after an atomic release
# switch to compare exact file hashes. Public HTTPS is checked by Actions.
server {
    listen 127.0.0.1:8080;
    server_name blog.minliny.com;

    root /srv/blog/current;
    access_log off;

    location ~ ^/(deployment\.json|index\.html|content-manifest\.json|feed\.xml|sitemap\.xml)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
